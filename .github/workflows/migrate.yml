name: ABDCM — aplicar migrations no banco de produção

# Botão manual (Actions → este workflow → Run workflow). Idempotente: cada
# arquivo em src/server/db/migrations é registrado em _migrations e só roda
# uma vez, então é seguro disparar de novo sem duplicar nada.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite MIGRAR para confirmar (roda contra o banco de produção)'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Confere a confirmação
        if: ${{ github.event.inputs.confirmar != 'MIGRAR' }}
        run: |
          echo "Digite exatamente MIGRAR no campo de confirmação para rodar."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Aplica as migrations pendentes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
